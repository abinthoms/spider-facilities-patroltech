version: '3.8'
name: patrol-tech

services:
  mariadb:
    image: mariadb:10.3
    container_name: patrol_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: patrol_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      APP_URL: ${APP_URL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - '3000:3000'

  dashboard:
    build: ./dashboard
    container_name: patrol_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8081:80'

  app:
    build: ./app
    container_name: patrol_app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8082:80'

volumes:
  mysql_data:
