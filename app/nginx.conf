server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker files must always be revalidated, never cached long-term
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
    }
}
