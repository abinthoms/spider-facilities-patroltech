<mat-card class="card full-width">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title><mat-icon mat-card-avatar>schedule</mat-icon>Timesheet</mat-card-title>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="filterForm" (ngSubmit)="search()" class="filter-form">
      <mat-form-field appearance="fill">
        <mat-label>From</mat-label>
        <input matInput type="date" formControlName="from">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>To</mat-label>
        <input matInput type="date" formControlName="to">
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">Search</button>
      <button mat-stroked-button type="button" (click)="exportCsv()">
        <mat-icon>download</mat-icon>
        Export CSV
      </button>
    </form>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <ng-container matColumnDef="guard">
        <th mat-header-cell *matHeaderCellDef>Guard</th>
        <td mat-cell *matCellDef="let element">{{ element.patrollerName }}</td>
      </ng-container>

      <ng-container matColumnDef="shifts">
        <th mat-header-cell *matHeaderCellDef>Shifts</th>
        <td mat-cell *matCellDef="let element">{{ element.shiftsCount }}</td>
      </ng-container>

      <ng-container matColumnDef="hours">
        <th mat-header-cell *matHeaderCellDef>Total hours</th>
        <td mat-cell *matCellDef="let element">{{ element.totalHours | number:'1.1-2' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="3">No completed shifts in this range</td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
