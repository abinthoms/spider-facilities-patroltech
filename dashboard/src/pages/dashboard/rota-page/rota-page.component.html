<mat-card class="card full-width">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title><mat-icon mat-card-avatar>event_note</mat-icon>Rota</mat-card-title>
      <mat-icon (click)="addShift()">add</mat-icon>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <ng-container matColumnDef="site">
        <th mat-header-cell *matHeaderCellDef>Site</th>
        <td mat-cell *matCellDef="let element">{{ element.Location?.address ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="guard">
        <th mat-header-cell *matHeaderCellDef>Guard</th>
        <td mat-cell *matCellDef="let element">{{ element.Patroller?.name ?? 'Unassigned' }}</td>
      </ng-container>

      <ng-container matColumnDef="start">
        <th mat-header-cell *matHeaderCellDef>Start</th>
        <td mat-cell *matCellDef="let element">{{ element.startTime | date:'dd/MM/yy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="end">
        <th mat-header-cell *matHeaderCellDef>End</th>
        <td mat-cell *matCellDef="let element">{{ element.endTime | date:'dd/MM/yy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          <span class="status-chip status-{{ element.status }}">{{ element.status }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="warnings">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <mat-icon *ngIf="hasWarnings(element)" class="wtr-warning-icon" [matTooltip]="warningsTooltip(element)">warning</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">No shifts scheduled</td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
