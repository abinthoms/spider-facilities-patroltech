<mat-card class="card full-width">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title><mat-icon mat-card-avatar>history</mat-icon>Audit Log</mat-card-title>
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef>When</th>
        <td mat-cell *matCellDef="let element">{{ element.createdAt | date:'dd/MM/yy HH:mm:ss' }}</td>
      </ng-container>

      <ng-container matColumnDef="actor">
        <th mat-header-cell *matHeaderCellDef>Actor</th>
        <td mat-cell *matCellDef="let element">{{ element.actorType ?? 'system' }}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">{{ element.action }}</td>
      </ng-container>

      <ng-container matColumnDef="entity">
        <th mat-header-cell *matHeaderCellDef>Entity</th>
        <td mat-cell *matCellDef="let element">{{ element.entityType }}</td>
      </ng-container>

      <ng-container matColumnDef="details">
        <th mat-header-cell *matHeaderCellDef>Details</th>
        <td mat-cell *matCellDef="let element" class="details-cell" [matTooltip]="element.details | json">{{ element.details | json }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">No audit entries yet</td>
      </tr>
    </table>

    <div class="pagination" *ngIf="totalPages > 1">
      <button mat-icon-button (click)="prevPage()" [disabled]="page <= 1">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <span>Page {{ page }} of {{ totalPages }}</span>
      <button mat-icon-button (click)="nextPage()" [disabled]="page >= totalPages">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </mat-card-content>
</mat-card>
